logger:
  level: INFO
storage:
  type: sql
  dbString: 'postgresql://postgres:postgres@localhost:55433/app_db?sslmode=disable'
rabbitmq:
  host: "localhost"
  port: 5672
  user: user
  password: user
  queueName: events
  timeout: 3s
scheduler:
  notificationCron: "* * * * *" # каждую минуту
  eventDeletionCron: "0 10 * * *" # каждый день в 10 утра

