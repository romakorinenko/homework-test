logger:
  level: INFO
storage:
  type: sql
  dbString: 'postgresql://postgres:postgres@localhost:5432/app_db?sslmode=disable'
http:
  port: "8080"
  timeout: "10s"
grpc:
  host: localhost
  port: "50051"
  timeout: "10s"
rabbitmq:
  host: "localhost"
  port: 5672
  user: user
  password: user
  queueName: events
  timeout: 3s
scheduler:
  notificationCron: "* * * * *" # каждую минуту
  eventDeletionCron: "0 10 * * *" # каждый день в 10 утра

