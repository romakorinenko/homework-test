syntax = "proto3";

package event;

import "google/protobuf/timestamp.proto";

option go_package = "./pb";

message Event {
  int64 id = 1;
  string title = 2;
  google.protobuf.Timestamp startDate = 3;
  google.protobuf.Timestamp endDate = 4;
  int64 user_id = 5;
}

message EmptyEventResponse {
}

message ListEventResponse {
  repeated Event events = 1;
}

service EventService {
  rpc Create(Event) returns (Event);
  rpc Update(Event) returns (EmptyEventResponse);
  rpc Delete(Event) returns (EmptyEventResponse);
  rpc ListByDay(Event) returns (ListEventResponse);
  rpc ListByWeek(Event) returns (ListEventResponse);
  rpc ListByMonth(Event) returns (ListEventResponse);
}
