version: "3.8"

networks:
  default:
    driver: bridge

services:
  postgres:
    image: postgres:14.6-alpine3.17
    environment:
      TZ: 'Europe/Moscow'
      POSTGRES_DB: app_db
      SCHEMA: public
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 55433:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrations:
    image: ghcr.io/kukymbr/goose-docker:3.24.3
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=postgres port=5432 user=postgres password=postgres dbname=app_db sslmode=disable
    volumes:
      - ./migrations:/migrations
    depends_on:
      - postgres
    restart: on-failure
    command: up

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user

  integration-tests:
    build:
      context: .
      dockerfile: ./build/Dockerfile_test
    container_name: integration-tests
    depends_on:
       - postgres
       - rabbitmq
       - migrations
    working_dir: /app

